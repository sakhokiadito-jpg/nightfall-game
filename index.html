<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d0c"><title>NIGHTFALL — Blackwood Forest</title></head><body><div id="app">
<section id="menu" class="screen"><div class="brand">NIGHTFALL<span>BLACKWOOD FOREST</span></div><div class="panel"><label>ИМЯ ИГРОКА</label><input id="playerName" maxlength="16" value="Survivor"><button id="createBtn" class="primary">СОЗДАТЬ КОМНАТУ</button><div class="join-row"><input id="roomCode" maxlength="5" placeholder="КОД КОМНАТЫ"><button id="joinBtn">ВОЙТИ</button></div><p id="menuMessage" class="message">Создай комнату или введи код друга.</p></div><p class="footnote">1 МАНЬЯК · ДО 5 ВЫЖИВШИХ · ВЫБЕРИСЬ ИЗ ЛЕСА</p></section>
<section id="lobby" class="screen hidden"><div class="lobby-card"><div class="brand small">NIGHTFALL</div><p class="muted">КОД КОМНАТЫ</p><div id="lobbyCode" class="room-code">-----</div><button id="copyCode">СКОПИРОВАТЬ КОД</button><div id="playerList" class="player-list"></div><button id="startBtn" class="primary" disabled>НАЧАТЬ МАТЧ</button><p id="lobbyMessage" class="message">Нужно минимум 2 игрока.</p></div></section>
<section id="game" class="hidden"><canvas id="world"></canvas><div class="top-hud"><div class="objective">BLACKWOOD FOREST<span id="objectiveText">Найди генераторы</span></div><div id="roleTag" class="role-tag">ВЫЖИВШИЙ</div></div>
<div id="survivorHud" class="survivor-hud"><div class="stat">ЗДОРОВЬЕ<div class="bar"><i id="healthFill"></i></div></div><div class="stat">ВЫНОСЛИВОСТЬ<div class="bar stamina"><i id="staminaFill"></i></div></div><div id="heart" class="heart">♥</div><div class="inventory"><button data-item="flashlight" class="slot selected">🔦</button><button data-item="crowbar" class="slot">🔧</button><button data-item="taser" class="slot">⚡</button><button data-item="medkit" class="slot">＋</button></div></div>
<div id="killerHud" class="killer-hud hidden"><div class="killer-items"><button data-trap="bear" class="trap selected">🐻</button><button data-trap="wire" class="trap">〰</button><button data-trap="electric" class="trap">⚡</button><button data-trap="spikes" class="trap">▴</button><button data-trap="machete" class="trap">🔪</button></div><button id="placeTrap">УСТАНОВИТЬ</button><button id="attackBtn" class="attack">УДАР</button></div>
<div class="mobile-controls"><div id="joystick" class="joystick"><div id="stick"></div></div><div class="actions"><button id="interactBtn">ДЕЙСТВИЕ</button><button id="runBtn">БЕГ</button></div></div><div id="gameNotice" class="game-notice"></div><div id="matchOverlay" class="match-overlay hidden"><div class="panel"><h2 id="matchTitle">МАТЧ ОКОНЧЕН</h2><p id="matchText"></p><button id="backLobby">В МЕНЮ</button></div></div></section></div><script type="module" src="/src/main.js"></script></body></html>
